{% extends "layout.html" %}
{% block main %}
<main class="flex-1 overflow-auto scrollbar-none flex flex-col gap-y-100 pb-5 md:pb-10 justify-start items-center bg-gradient-to-b from-slate-950 via-indigo-950 to-slate-900 pb-10">
    <div id="map" class="h-[82dvh] w-[96dvw] mt-10 rounded-lg shadow-2xl focus:outline-none"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>

<script>
    // 1. Corrected Color Function using EPA Zone logic (1 = High Risk, 3 = Low Risk)
    function getColor(zone) {
        switch (zone) {
            case 1: return "#dc2626"; // Red (Highest)
            case 2: return "#f97316"; // Orange (Moderate)
            case 3: return "#facc15"; // Yellow (Lowest)
            default: return "#374151"; // Gray (Default/No Data)
        }
    }

    let fipsLookup = {};
    let leaponLookup = {};
    let statesLayer;
    let choroplethLayer;
    const ORDER = [
        "City / Town",
        "County",
        "State",
        "Building Type",
        "Occupancy Type",
        "Ventilation During Measurement",
        "Measurement Start Date",
        "Measurement Start Time",
        "Measurement End Date",
        "Measurement End Time",
        "Radon Long-Term Average",
        "Radon Short Term Average",
        "PM2.5",
        "Notes"
    ];

    // 2. Map Initialization
    const usBounds = L.latLngBounds(
        [24.396308, -125.0],   // Southwest
        [49.384358, -66.93457] // Northeast
    );

    const map = L.map("map", {
        preferCanvas: true,
        zoomControl: true,
        minZoom: 1.5,
        maxZoom: 10,
        attributionControl: false
    });

    map.fitBounds(usBounds);

    // 3. Load Data & Geometries Asynchronously
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            // Fetch Radon Data from API
            const response = await fetch('/data-api');
            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
            
            const rawData = await response.json();
            
            const epaData = rawData["EPA-Data"];
            Object.values(epaData)
            .flatMap(countyArray => countyArray)
            .forEach(item => {
                if (item && item.FIPS) {
                    // Ensure FIPS is zero-padded to 5 digits (e.g. "01001")
                    const formattedFips = String(item.FIPS).padStart(5, '0');
                    fipsLookup[formattedFips] = item;
                }
            });
            
            // 2. Process Leapon Data into arrays per FIPS
            const leaponData = rawData["Leapon-Data"];
            if (Array.isArray(leaponData)) {
                leaponData.forEach(item => {
                    if (item && item.FIPS) {
                        const formattedFips = String(item.FIPS).padStart(5, '0');
                        if (!leaponLookup[formattedFips]) {
                            leaponLookup[formattedFips] = [];
                        }
                        leaponLookup[formattedFips].push(item);
                    }
                });
            }

            // Fetch TopoJSON Geometries
            const topoRes = await fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json");
            const us = await topoRes.json();

            const states = topojson.feature(us, us.objects.states);
            const counties = topojson.feature(us, us.objects.counties);

            // Render State Boundaries
            statesLayer = L.geoJSON(states, {
                style: {
                    color: "#000",
                    weight: 2,
                    fillOpacity: 0
                }
            }).addTo(map);

            // Render County Choropleth
            choroplethLayer = L.geoJSON(counties, {
                style: feature => {
                    const fips = String(feature.id).padStart(5, '0');
                    const epaCounty = fipsLookup[fips];

                    return {
                        fillColor: epaCounty ? getColor(epaCounty["Zone"]) : "#374151",
                        fillOpacity: 0.8,
                        color: "#111827",
                        weight: 0.4
                    };
                },
                onEachFeature: (feature, layer) => {
                    const fips = String(feature.id).padStart(5, '0');
                    const epaCounty = fipsLookup[fips];
                    const leaponEntries = leaponLookup[fips];

                    // Don't bind popup if neither data source has info for this county
                    if (!epaCounty && !leaponEntries) return;

                    // Base popup content (EPA Info)
                    let hoverContent = `
                        <div class="text-slate-900 font-sans">
                            <b>${epaCounty ? epaCounty["COUNTY LABEL"] : 'County'}, ${epaCounty ? epaCounty.STATE : ''}</b><br>
                            EPA Zone: <b>${epaCounty ? epaCounty.Zone : 'N/A'}</b><br>
                            EPA Region: <b>${epaCounty ? epaCounty.Region : 'N/A'}</b>
                    `;
                    // If Leapon data exists for this FIPS, append it to the hover popup.
                    if (leaponEntries && leaponEntries.length > 0) {
                        hoverContent += `
                            <hr class="my-1 border-slate-300">
                            <div class="text-indigo-900 font-semibold">Leapon Data (${leaponEntries.length} entries)...</div>
                        `;
                    }
                    hoverContent += `</div>`;
                    layer.bindTooltip(hoverContent, {
                        sticky: true,
                        direction: 'auto'
                    });

                    // Click popup content.
                    let clickContent = `
                        <div class="text-slate-900 font-sans">
                            <b>${epaCounty ? epaCounty["COUNTY LABEL"] : 'County'}, ${epaCounty ? epaCounty.STATE : ''}</b><br>
                            EPA Zone: <b>${epaCounty ? epaCounty.Zone : 'N/A'}</b><br>
                            EPA Region: <b>${epaCounty ? epaCounty.Region : 'N/A'}</b>
                    `;
                    if (leaponEntries && leaponEntries.length > 0) {
                        clickContent += `
                            <div class="mt-2">
                                <h4 class="font-bold text-xs text-indigo-900 uppercase tracking-wide mb-1.5">
                                    Leapon Data (${leaponEntries.length})
                                </h4>
                                <div class="flex flex-col gap-1.5">
                        `;

                        leaponEntries.forEach((entry, idx) => {
                            const entryLabel = `Entry #${idx + 1}`;
                            clickContent += `
                                <details class="group bg-slate-50 border border-slate-200 rounded text-xs overflow-hidden">
                                    <summary class="cursor-pointer font-medium p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 flex justify-between items-center select-none">
                                        <span>${entryLabel}</span>
                                        <span class="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                                    </summary>
                                    <div class="p-2 border-t border-slate-200 space-y-1 bg-white">`
                            ORDER.forEach(key => {
                                // Check if key exists.
                                if (entry.hasOwnProperty(key) && entry[key] !== null && entry[key] !== undefined) {
                                    clickContent += `
                                        <div class="flex justify-between gap-2 border-b border-slate-100 last:border-none p-2 w-fit">
                                            <span class="text-slate-500">${key}:</span>
                                            <span class="font-semibold text-slate-800 text-right">${entry[key]}</span>
                                        </div>
                                    `;
                                }
                            })
                            clickContent += `</div></details>`;
                        });
                        clickContent += `
                                </div>
                            </div>
                        `;
                    }
                    clickContent += `</div>`;
                    layer.bindPopup(clickContent);

                    // Hover effects
                    layer.on('mouseover', function () {
                        this.setStyle({
                            fillColor: "#6b7280",
                            fillOpacity: 0.9,
                            color: "#ffffff",
                            weight: 1.5
                        });

                        if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                            this.bringToFront();
                        }
                    });
                    layer.on('mouseout', function (e) {
                        choroplethLayer.resetStyle(e.target);
                    });
                }
            }).addTo(map);

        } catch (error) {
            console.error('Map initialization failed:', error);
        }
    });
</script>
{% endblock %}
